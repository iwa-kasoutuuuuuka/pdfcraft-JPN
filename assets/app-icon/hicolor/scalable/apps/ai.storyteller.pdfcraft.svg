<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PdfCraft app icon: a PDF page floating above its shadow. Original artwork for PdfCraft
       (MIT OR Apache-2.0). Three colours, no fonts: the PDF lettering is drawn as strokes. -->
  <defs>
    <clipPath id="t"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#t)">
    <rect width="512" height="512" fill="#b70228"/>
    <!-- shadow on the ground: the page hovers above it -->
    <ellipse cx="256" cy="448" rx="116" ry="15" fill="#0b0b0c" opacity="0.32"/>
    <!-- lift marks between the page and its shadow -->
    <g stroke="#efe9dc" stroke-width="9" stroke-linecap="round" opacity="0.6">
      <path d="M196 408v14M256 414v14M316 408v14"/>
    </g>
    <!-- the page -->
    <g transform="translate(256 228) rotate(-8)" stroke="#0b0b0c" stroke-linejoin="round">
      <path d="M-122 -158H58L122 -94V158H-122Z" fill="#efe9dc" stroke-width="12"/>
      <path d="M58 -158V-94H122" fill="#efe9dc" stroke-width="12"/>
      <!-- PDF lettering -->
      <g fill="none" stroke-width="17" stroke-linecap="butt">
        <path d="M-90 0V-66H-67A17.5 17.5 0 0 1 -67 -31H-90"/>
        <path d="M-24 -66H-8Q26 -66 26 -33Q26 0 -8 0H-24Z"/>
        <path d="M52 0V-66H88M52 -35H80"/>
      </g>
      <!-- text lines -->
      <g stroke="#b70228" stroke-width="11" stroke-linecap="round">
        <path d="M-84 42H84M-84 74H84M-84 106H34"/>
      </g>
    </g>
  </g>
</svg>
