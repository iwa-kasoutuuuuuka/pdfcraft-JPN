[package]
name = "pdfcraft-ocr-gpu"
description = "Scan & OCR: run the PP-OCRv5 networks on the GPU through wgpu (L7; the program registers it with the engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-ocr = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The device the app already draws with (eframe's wgpu, the same version; nothing new in the
# tree). No features of its own: the program's eframe decides the backends.
wgpu = { version = "30.0.1", default-features = false }
